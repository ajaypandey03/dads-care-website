services:
  # No mysql service here — this dev setup reuses the MySQL server already running
  # natively on the host (127.0.0.1:3306), with a "dadscare" DB/user created inside it
  # (see .env.example for the exact CREATE DATABASE/USER statements). If you'd rather
  # run MySQL in Docker instead, add a mysql:8.0 service back here on a free host port
  # and point DB_PORT/.env at it.
  redis:
    image: redis:7-alpine
    ports:
      # Non-default host port — 6379 is already taken by another local dev stack on
      # this machine. Matches REDIS_PORT in .env.example.
      - "6381:6379"
