spring:
  application:
    name: dadscare-backend

  datasource:
    # Default port is the standard 3306 — this now points at a "dadscare" DB/user
    # created inside whatever local MySQL server is already running (see .env.example),
    # rather than running a second MySQL via docker-compose.yml. Override via .env
    # (auto-loaded — see spring-dotenv in pom.xml) if you do run the compose service.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dadscare}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:dadscare}
    password: ${DB_PASSWORD:dadscare}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema — Hibernate never creates/alters tables, even locally.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # Port default (6381) matches docker-compose.yml — 6379 is already used by another
      # local dev stack on this machine.
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8090}

app:
  jwt:
    # openssl rand -hex 64
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-dev-only}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:60}

  webhook:
    # HMAC-SHA256 shared secret for the whole Velosyss -> Dad's Care push (see
    # WebhookSignatureVerifier) — one secret for the platform, not per Organization,
    # since Velosyss only knows Dad's Care as a single Enterprise account. Empty by
    # default so an unconfigured environment fails closed rather than accepting
    # unsigned requests.
    velosyss-secret: ${WEBHOOK_VELOSYSS_SECRET:}
    max-clock-skew-seconds: ${WEBHOOK_MAX_SKEW_SEC:300}

  cors:
    # Browser-based clients only (mobile never hits CORS) — website/'s dashboard (Phase 3)
    # and dadscare-mobile's Expo web target for local testing. Comma-separated list.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:8092}

  velosyss:
    # Velosyss's Partner Integration Layer REST API (see "Velosyss Lock Integration Guide"
    # in Confluence) — used by VelosyssCommandClient (SEAL/UNSEAL relay) and
    # VelosyssReadClient (positions/events polling). Defaults to the real base URL; only
    # api-key needs to be set per environment. Blank api-key means "not configured" — both
    # clients log and return a graceful empty/failure result rather than throwing, so the
    # app still runs (without live lock control) in an environment with no key yet.
    api-base-url: ${VELOSYSS_API_BASE_URL:https://velosyss.com/api/v1}
    api-key: ${VELOSYSS_API_KEY:}
    # Reconciliation safety net (§5) — never the primary signal, real-time state comes from
    # the webhook. positions is cheap and frequent (dashboard live view); events is a
    # missed-webhook backstop and can be much less frequent.
    positions-poll-ms: ${VELOSYSS_POSITIONS_POLL_MS:20000}
    events-poll-ms: ${VELOSYSS_EVENTS_POLL_MS:180000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.dadscare: INFO
